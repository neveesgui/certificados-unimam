<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Validação de Certificado · UNIMAM</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/favicon.png" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="brand-group">
        <img src="/static/logo_unimam.png" alt="UNIMAM - Centro Universitário Maria Milza" class="unimam-logo-img" />
        <div class="mec-badge" aria-label="Nota 5 no MEC">
          <span class="mec-score">5</span>
          <div class="mec-info">
            <div class="mec-stars">★★★★★</div>
            Conceito<br />Institucional MEC
          </div>
        </div>
      </a>
      <div class="nav-links">
        <a href="https://unimam.com.br" target="_blank" rel="noopener noreferrer" class="nav-pill">Portal UNIMAM ↗</a>
      </div>
    </div>
  </nav>

  <section class="hero-banner" style="padding-bottom:80px"></section>

  <main class="page">
    <section class="glass" id="cartao">
      <div class="verdict" id="carregando">
        <p>Verificando autenticidade da chave…</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>UNIMAM · Centro Universitário Maria Milza — Consulta Pública de Certificados</span>
    <a href="https://github.com/neveesgui" target="_blank" rel="noopener noreferrer" class="author-badge" title="Desenvolvido por Guilherme Neves (@neveesgui)">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
      </svg>
      <span>Desenvolvido por <strong>Guilherme Neves</strong> (@neveesgui)</span>
    </a>
  </footer>

  <script>
    const parametros = new URLSearchParams(location.search);
    const cartao = document.getElementById('cartao');

    function el(tag, texto, classe) {
      const e = document.createElement(tag);
      if (texto !== undefined) e.textContent = texto;
      if (classe) e.className = classe;
      return e;
    }

    function linha(rotulo, valor, classe) {
      const div = el('div');
      div.append(el('dt', rotulo), el('dd', valor, classe));
      return div;
    }

    function renderizarFormularioStateless(codigoInicial, mensagemAviso) {
      cartao.innerHTML = '';
      const box = el('div');
      const titulo = el('h2', 'Verificação Criptográfica SHA-256');
      titulo.className = 'card-title';
      titulo.style.marginBottom = '6px';

      const sub = el('p', mensagemAviso || 'Confirme os dados impressos no certificado para validar a assinatura matemática:');
      sub.style.color = 'var(--text-2)';
      sub.style.fontSize = '14px';
      sub.style.marginBottom = '18px';

      const form = el('form');
      form.innerHTML = `
        <div class="fields">
          <div class="field">
            <input id="v-codigo" placeholder=" " required />
            <label for="v-codigo">Chave de Autenticidade</label>
          </div>
          <div class="row-2">
            <div class="field">
              <input id="v-nome" placeholder=" " required />
              <label for="v-nome">Nome do Aluno (como no certificado)</label>
            </div>
            <div class="field">
              <input id="v-evento" placeholder=" " required />
              <label for="v-evento">Nome do Evento</label>
            </div>
          </div>
          <div class="row-2">
            <div class="field">
              <input id="v-horas" type="number" min="1" placeholder=" " required />
              <label for="v-horas">Carga Horária (h)</label>
            </div>
            <div class="field">
              <input id="v-data" placeholder=" " required />
              <label for="v-data">Data de Emissão (DD/MM/AAAA)</label>
            </div>
          </div>
        </div>
        <div class="form-footer">
          <a href="/" class="btn ghost">Voltar</a>
          <button type="submit" class="btn">Validar Assinatura SHA-256</button>
        </div>
      `;
      form.querySelector('#v-codigo').value = codigoInicial || '';

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        parametros.set('codigo', form.querySelector('#v-codigo').value.trim().toUpperCase());
        parametros.set('nome', form.querySelector('#v-nome').value.trim());
        parametros.set('evento', form.querySelector('#v-evento').value.trim());
        parametros.set('carga_horaria', form.querySelector('#v-horas').value.trim());
        parametros.set('data_emissao', form.querySelector('#v-data').value.trim());
        validar();
      });

      box.append(titulo, sub, form);
      cartao.append(box);
    }

    async function validar() {
      const resposta = await fetch(`/api/validar?${parametros.toString()}`);
      const r = await resposta.json();

      if (r.requer_dados_stateless) {
        renderizarFormularioStateless(r.codigo_consultado || parametros.get('codigo'), r.mensagem);
        return;
      }

      cartao.innerHTML = '';
      const verdict = el('div', undefined, 'verdict');

      if (r.valido) {
        const d = r.dados;
        verdict.append(
          el('div', '✓', 'seal ok'),
          el('h2', 'Certificado Autêntico'),
          el('p', d.nome)
        );
        const lista = el('dl', undefined, 'list');
        lista.append(
          linha('Evento Acadêmico', d.evento),
          linha('Carga Horária', `${d.carga_horaria} horas`),
          linha('Data de Emissão', d.data_emissao),
          linha('Chave de Autenticidade', r.codigo_autenticidade, 'mono')
        );
        verdict.append(lista);
      } else {
        verdict.append(
          el('div', '✕', 'seal bad'),
          el('h2', 'Chave Não Verificada'),
          el('p', r.mensagem)
        );
      }

      const acoes = el('div', undefined, 'actions');
      const voltar = el('a', 'Voltar ao Portal', 'btn ghost');
      voltar.href = '/';
      acoes.append(voltar);
      verdict.append(acoes);

      cartao.append(verdict);
    }

    validar().catch(() => { cartao.textContent = 'Falha ao consultar chave.'; });
  </script>
</body>
</html>
